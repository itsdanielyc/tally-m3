name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require the Tier 1 macOS architecture
        if: runner.os == 'macOS'
        run: node -e "if(process.arch!=='arm64')throw Error('Tier 1 requires macOS arm64')"
      - run: npm ci
      - name: Release version agreement
        run: npm run check:versions
      - name: L0 types
        run: npm run typecheck
      - name: L1 domain
        run: npm run test:unit
      - name: L2 mock and file conformance
        run: npm run test:contract
      - name: L3 real file I/O
        run: npm run test:integration
      - name: Linux shell dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64
      - name: Chromium
        timeout-minutes: 12
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          bound=""; command -v timeout >/dev/null && bound="timeout 420"
          for attempt in 1 2; do
            $bound npx playwright install --with-deps chromium && exit 0
            echo "browser installation attempt $attempt failed or stalled"
          done
          exit 1
      - name: L4 and L5 browser and visuals
        env:
          CI: "1"
        run: npm run test:ui
      - name: Electron binary
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Build already type-checked source
        run: npx electron-vite build
      - name: L6 real Electron
        shell: bash
        env:
          CI: "1"
          NO_AT_BRIDGE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.os }}
          path: |
            artifacts/e2e
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
  sheet:
    name: contact sheet
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: verify-*
          path: shots
      - run: node scripts/contact-sheet.mjs shots contact-sheet.html
      - uses: actions/upload-artifact@v7
        with:
          name: contact-sheet
          path: contact-sheet.html
          retention-days: 14